services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assistant_agent
      POSTGRES_USER: assistant_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_agent -d assistant_agent"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      APP_ENV: development
      BASE_URL: http://localhost:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+psycopg://assistant_agent:${POSTGRES_PASSWORD}@db:5432/assistant_agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_DEBUG_STREAM: ${CLAUDE_DEBUG_STREAM:-false}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-assistant-agent-sandbox:local}
      SANDBOX_DEPLOYMENT_ID: ${SANDBOX_DEPLOYMENT_ID:-local}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-assistant-agent-local-sandboxes}
      SANDBOX_HOST_INPUT_ROOT: ${SANDBOX_HOST_INPUT_ROOT:?Run deploy/local.sh to resolve the absolute session root}
      SANDBOX_APP_INPUT_ROOT: /srv/assistant-agent/session-inputs
      CHAT_MAX_SESSIONS: ${CHAT_MAX_SESSIONS:-4}
      CHAT_IDLE_SECONDS: ${CHAT_IDLE_SECONDS:-1800}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_INPUT_ROOT}:/srv/assistant-agent/session-inputs
    networks:
      default:
      sandbox:
        aliases: [app]
    # deploy/local.sh discovers this inside Docker, including Docker Desktop/OrbStack.
    group_add: ["${DOCKER_GID:-0}"]
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
secrets:
  db_password:
    file: ./deploy/local-db-password.txt
volumes:
  pgdata:

networks:
  sandbox:
    name: ${SANDBOX_NETWORK:-assistant-agent-local-sandboxes}
    driver: bridge
