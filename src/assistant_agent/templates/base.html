<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Assistant AI{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9728;</text></svg>">
<style>
  :root {
    color-scheme: light dark;

    --bg: #fbfbfd;
    --glow-a: rgba(99, 102, 241, 0.14);
    --glow-b: rgba(56, 189, 248, 0.12);

    --surface: #ffffff;
    --surface-sunken: #f6f7f9;
    --border: #e6e8ec;
    --border-strong: #d4d8de;

    --fg: #0f1115;
    --fg-muted: #5c6270;
    --fg-subtle: #878d9a;

    --accent: #4f46e5;
    --ring: rgba(79, 70, 229, 0.35);

    --ok: #16794a;
    --ok-bg: rgba(22, 121, 74, 0.1);
    --bad: #b3261e;
    --bad-bg: rgba(179, 38, 30, 0.09);

    --shadow-sm: 0 1px 2px rgba(15, 17, 21, 0.05);
    --shadow-lg: 0 1px 2px rgba(15, 17, 21, 0.04),
                 0 8px 24px -8px rgba(15, 17, 21, 0.10),
                 0 24px 48px -24px rgba(15, 17, 21, 0.12);
    --radius: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0b0e;
      --glow-a: rgba(99, 102, 241, 0.18);
      --glow-b: rgba(56, 189, 248, 0.10);

      --surface: #14161b;
      --surface-sunken: #1a1d23;
      --border: #262a32;
      --border-strong: #343945;

      --fg: #f2f4f7;
      --fg-muted: #9ba2b0;
      --fg-subtle: #6e7684;

      --accent: #818cf8;
      --ring: rgba(129, 140, 248, 0.35);

      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.12);
      --bad: #f87171;
      --bad-bg: rgba(248, 113, 113, 0.12);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.3),
                   0 8px 24px -8px rgba(0, 0, 0, 0.5),
                   0 24px 48px -24px rgba(0, 0, 0, 0.7);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: 56px 16px 72px;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Soft ambient light, purely decorative. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(60ch 40ch at 18% -8%, var(--glow-a), transparent 70%),
      radial-gradient(50ch 36ch at 92% 4%, var(--glow-b), transparent 70%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
  }

  /* --- masthead --- */

  .masthead { text-align: center; margin-bottom: 28px; }

  .mark {
    width: 46px; height: 46px;
    margin: 0 auto 16px;
    border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #6366f1, #4f46e5 45%, #7c3aed);
    box-shadow: 0 6px 16px -6px rgba(79, 70, 229, 0.6), var(--shadow-sm);
  }
  .mark svg { width: 24px; height: 24px; display: block; }

  h1 {
    font-size: 1.5rem;
    font-weight: 640;
    letter-spacing: -0.021em;
    margin: 0 0 6px;
  }

  .tagline {
    color: var(--fg-muted);
    margin: 0;
    font-size: 0.95rem;
    text-wrap: balance;
  }

  /* --- card --- */

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 26px;
    margin-bottom: 16px;
  }

  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 4px;
  }

  h2 {
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: -0.011em;
    margin: 0;
    overflow-wrap: anywhere;
  }

  .meta { color: var(--fg-subtle); font-size: 0.85rem; }
  .lede { color: var(--fg-muted); margin: 8px 0 0; font-size: 0.92rem; }

  textarea {
    display: block; width: 100%; margin-top: 8px; padding: 10px 12px;
    resize: vertical; border: 1px solid var(--border-strong);
    border-radius: 10px; background: var(--surface); color: var(--fg);
    font: inherit;
  }
  textarea:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .message-response {
    white-space: pre-wrap; overflow-wrap: anywhere; margin: 16px 0 0;
    font: inherit;
  }

  /* Signed-in account sidebar and chat workspace. */
  main.connected-page { max-width: 1440px; padding-inline: clamp(0px, 2vw, 24px); }
  .connected-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 7fr); gap: 24px; align-items: start; }
  .account-sidebar { min-width: 0; }
  .account-sidebar .card-head { flex-wrap: wrap; }
  .chat-card { display: flex; flex-direction: column; min-width: 0; height: 70vh; height: 70dvh; min-height: 520px; padding: 0; overflow: hidden; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid var(--border); }
  .chat-header .lede { margin-top: 2px; font-size: 0.85rem; }
  .chat-transcript { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 24px; display: flex; flex-direction: column; gap: 22px; }
  .chat-empty { margin: auto; text-align: center; max-width: 320px; color: var(--fg-muted); }
  .chat-empty strong { display: block; color: var(--fg); font-size: 1.1rem; margin-bottom: 8px; }
  .chat-empty p { margin: 0; }
  .chat-message { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; flex: none; }
  .chat-message-user { align-self: flex-end; flex-direction: row-reverse; }
  .chat-message-assistant { align-self: flex-start; }
  .chat-avatar { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; font-size: 0.7rem; font-weight: 700; background: var(--surface-sunken); color: var(--fg-muted); border: 1px solid var(--border); }
  .chat-message-user .chat-avatar { background: var(--accent); color: var(--surface); border-color: transparent; }
  .chat-message-body { min-width: 0; }
  .chat-sender { display: block; color: var(--fg-muted); font-size: 0.75rem; font-weight: 600; margin: 0 4px 5px; }
  .chat-message-user .chat-sender { text-align: right; }
  .chat-bubble { margin: 0; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-sunken); white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.65; }
  .chat-message-user .chat-bubble { background: var(--ring); border-color: transparent; border-top-right-radius: 4px; }
  .chat-message-assistant .chat-bubble { border-top-left-radius: 4px; }
  .chat-bubble.is-pending { color: var(--fg-muted); font-style: italic; }
  .chat-status { min-height: 30px; padding: 4px 24px; margin: 0; font-size: 0.82rem; }
  .chat-composer { padding: 16px 24px 20px; border-top: 1px solid var(--border); background: var(--surface); }
  .chat-composer label { font-size: 0.82rem; font-weight: 550; color: var(--fg-muted); }
  .chat-composer textarea { min-height: 76px; max-height: 160px; resize: vertical; }
  .chat-composer .actions { margin-top: 12px; justify-content: flex-end; }
  .chat-composer .btn { background: var(--accent); color: var(--surface); border-color: transparent; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .chat-transcript:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

  @media (max-width: 899px) {
    .connected-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .account-sidebar .card { margin-bottom: 0; }
    .account-sidebar { display: grid; gap: 16px; }
    .chat-card { min-height: 460px; height: 75dvh; }
  }
  @media (max-width: 420px) {
    .chat-header { padding: 16px; gap: 8px; flex-wrap: wrap; }
    .chat-transcript { padding: 16px; gap: 18px; }
    .chat-message { max-width: 100%; gap: 8px; }
    .chat-avatar { width: 28px; height: 28px; }
    .chat-bubble { padding: 10px 12px; }
    .chat-status { padding-inline: 16px; }
    .chat-composer { padding: 12px 16px 16px; }
  }

  /* --- permission rows --- */

  .perms { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 2px; }

  .perms li {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface-sunken);
  }
  .perms .icon { flex: none; width: 17px; height: 17px; margin-top: 2px; color: var(--fg-subtle); }
  .perms .icon svg { width: 100%; height: 100%; display: block; }
  .perms strong { display: block; font-weight: 550; font-size: 0.9rem; }
  .perms span { color: var(--fg-subtle); font-size: 0.82rem; }

  /* --- buttons --- */

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  .btn {
    appearance: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 11px 18px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-size: 0.92rem;
    font-weight: 550;
    text-decoration: none;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background-color .15s ease, border-color .15s ease,
                transform .1s ease, box-shadow .15s ease;
  }
  .btn:hover { background: var(--surface-sunken); border-color: var(--fg-subtle); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

  .btn-google { width: 100%; padding-block: 13px; }
  .btn-google svg { flex: none; }

  .btn-quiet {
    background: transparent; box-shadow: none; border-color: var(--border);
    color: var(--fg-muted); font-weight: 500; padding: 9px 15px; font-size: 0.88rem;
  }
  .btn-quiet:hover { background: var(--surface-sunken); color: var(--fg); }

  /* --- badge --- */

  .badge {
    flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.74rem; font-weight: 600; letter-spacing: 0.01em;
    padding: 3px 9px 3px 7px; border-radius: 999px;
  }
  .badge::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
  }
  .badge-ok  { color: var(--ok);  background: var(--ok-bg); }
  .badge-bad { color: var(--bad); background: var(--bad-bg); }

  /* --- flash --- */

  .flash {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 18px;
    font-size: 0.89rem;
    box-shadow: var(--shadow-sm);
  }

  /* --- disclosure --- */

  details { margin-top: 18px; }
  summary {
    cursor: pointer; color: var(--fg-subtle); font-size: 0.85rem;
    list-style: none; display: inline-flex; align-items: center; gap: 6px;
    border-radius: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ""; width: 0; height: 0;
    border-left: 4px solid currentColor;
    border-block: 3.5px solid transparent;
    transition: transform .15s ease;
  }
  details[open] summary::before { transform: rotate(90deg); }
  summary:hover { color: var(--fg-muted); }
  summary:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

  .scopes { list-style: none; padding: 12px 0 0; margin: 0; display: grid; gap: 5px; }
  .scopes li {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.76rem;
    color: var(--fg-subtle);
    overflow-wrap: anywhere;
  }

  footer {
    position: relative; z-index: 1;
    margin-top: 28px; text-align: center;
    color: var(--fg-subtle); font-size: 0.8rem;
  }

  @media (max-width: 420px) {
    body { padding-top: 36px; }
    .card { padding: 20px; }
    .chat-card { padding: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
  {% if flash %}
  <div class="flash">
    <span aria-hidden="true">&#9432;</span>
    <span>{{ flash }}</span>
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
{% block footer %}{% endblock %}
</body>
</html>
