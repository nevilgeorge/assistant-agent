services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant_agent
      POSTGRES_USER: assistant_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [/srv/assistant-agent/postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant_agent -d assistant_agent"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    image: ${IMAGE_URI}
    restart: unless-stopped
    environment:
      APP_ENV: production
      BASE_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+psycopg://assistant_agent:${POSTGRES_PASSWORD}@db:5432/assistant_agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE_URI}
      SANDBOX_DEPLOYMENT_ID: ${SANDBOX_DEPLOYMENT_ID:-production}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-assistant-agent-production-sandboxes}
      SANDBOX_HOST_INPUT_ROOT: /srv/assistant-agent/session-inputs
      SANDBOX_APP_INPUT_ROOT: /srv/assistant-agent/session-inputs
      CHAT_MAX_SESSIONS: ${CHAT_MAX_SESSIONS:-4}
      CHAT_IDLE_SECONDS: ${CHAT_IDLE_SECONDS:-1800}
    # docker exec is a call to the daemon socket, not a connection to the container, so
    # driving the sandbox from here needs the socket -- being on a shared network does not
    # grant it. Note this is root-equivalent control of the host: anything that executes
    # code in this container can start a privileged container and mount the host's disk.
    # A future socket proxy must cover lifecycle and exec endpoints.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/assistant-agent/session-inputs:/srv/assistant-agent/session-inputs
    networks:
      default:
      sandbox:
        aliases: [app]
    # The image runs as uid 10001, which is in no group that can read the socket.
    # remote.sh resolves the host's docker gid, which differs between AMIs.
    group_add: ["${DOCKER_GID}"]
    depends_on:
      db: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/assistant-agent/caddy-data:/data
      - /srv/assistant-agent/caddy-config:/config
    depends_on: [app]

networks:
  sandbox:
    name: ${SANDBOX_NETWORK:-assistant-agent-production-sandboxes}
    driver: bridge
